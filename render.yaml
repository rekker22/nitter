services:
  - type: web
    name: nitter
    env: docker
    repo: https://github.com/rekker22/nitter/
    plan: free
    autoDeploy: false
    healthCheckPath: /Jack/status/20
    envVars:
      - key: NITTER_CONFIG
        value: /src/nitter.conf
      - key: REDIS_HOST
        value: nitter-redis:6379

  - type: pserv
    name: nitter-redis
    env: image
    image:
        url: docker.io/library/redis:6-alpine
    plan: free
